<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Jaxterity runtime on a GPU robot (Jetson Thor): C-engine control loop, MJX off-loop</title>
<desc>Off-board desktop/cloud GPU does policy training and model dev, and provisions the trained policy and calibrated model onto the robot. On the robot the GPU runs the VLA and occasional on-device re-fit; the ARM CPU runs the real-time C-engine loop: state estimator, fast controller, self-check co-processor, safety arbiter, actuator SDK. The calibrated model is written by re-fit and read by the loop; re-fit emits a new attestation handle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="680" height="600" fill="#ffffff"/>

