<rect x="356" y="298" width="284" height="50" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="498" y="318" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Fast controller (mjpc)</text><text x="498" y="336" text-anchor="middle" font-size="12" fill="#854F0B">C engine · 100 Hz–1 kHz · ⟳▣</text>
<rect x="356" y="372" width="284" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="498" y="392" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Safety arbiter</text><text x="498" y="410" text-anchor="middle" font-size="12" fill="#0F6E56">C / NumPy · 50 Hz</text>
<rect x="356" y="446" width="284" height="50" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="498" y="466" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Actuator / sensor SDK</text><text x="498" y="484" text-anchor="middle" font-size="12" fill="#993C1D">C / binary · 1 kHz</text>

