<text x="44" y="134" font-size="14" font-weight="500" fill="#2C2C2A">On-board: Jetson Thor — GPU (inference + occasional re-fit) · ARM CPU (C-engine loop)</text>

<rect x="46" y="150" width="284" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="188" y="170" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">VLA / perception</text><text x="188" y="188" text-anchor="middle" font-size="12" fill="#5F5E5A">TensorRT · ~7 Hz · ▣ · GPU</text>
