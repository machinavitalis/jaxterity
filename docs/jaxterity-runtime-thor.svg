<rect x="146" y="14" width="11" height="11" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="161" y="23" font-size="12" fill="#5F5E5A">jaxterity</text>
<rect x="252" y="14" width="11" height="11" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="267" y="23" font-size="12" fill="#5F5E5A">MuJoCo (C/MJX)</text>
<rect x="372" y="14" width="11" height="11" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="387" y="23" font-size="12" fill="#5F5E5A">jaxility</text>
<rect x="462" y="14" width="11" height="11" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="477" y="23" font-size="12" fill="#5F5E5A">NN/VLA</text>
<rect x="566" y="14" width="11" height="11" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="581" y="23" font-size="12" fill="#5F5E5A">hardware</text>
<text x="40" y="44" font-size="12" fill="#5F5E5A">tag = impl · frequency · ⟳ own solver loop · ▣ own state</text>

<rect x="30" y="56" width="620" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="44" y="73" font-size="14" font-weight="500" fill="#3C3489">Off-board: desktop / cloud GPU — policy training + model/twin dev</text>
<text x="44" y="88" font-size="12" fill="#534AB7">PyTorch / JAX · GPU-TPU · off-robot (not on the robot)</text>
